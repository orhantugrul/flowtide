root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/main ./src/main.go"
bin = "./.air/main"
full_bin = "APP_ENV=dev APP_USER=air ./.air/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", ".air", "vendor", "dashboard", "extensions"]
include_dir = ["src"]
exclude_file = []
log = "air.log"
delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = 500

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
